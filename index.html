<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Clicker 2 — Legend of the Slice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: radial-gradient(circle at 50% -10%, #4a2c14, #1d1005 65%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    color: #fff;
  }
  #app { width: 100%; max-width: 1200px; height: 100vh; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), transparent);
  }
  .logo { font-size: 24px; font-weight: 700; white-space: nowrap; }
  .logo span { color: #ffd34d; }
  .rank { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .rank b { color: #ffd34d; }
  .stats { display: flex; gap: 22px; margin-left: auto; font-size: 15px; }
  .stat span { display: block; font-size: 11px; opacity: 0.65; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 22px; display: inline-block; }
  .stat .mult { color: #6df5a0; font-size: 12px; margin-left: 3px; }
  .mute { font-size: 20px; background: rgba(255,255,255,0.08); border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; }

  .main { flex: 1; display: flex; overflow: hidden; }

  #clickArea {
    flex: 1; position: relative; cursor: pointer; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), transparent 70%);
  }
  #stage { position: relative; width: 340px; height: 360px; display: flex; align-items: center; justify-content: center; transition: transform 0.08s ease; filter: drop-shadow(0 18px 30px rgba(0,0,0,0.55)); }
  #stage.grow { transform: scale(1.1); }

  #board {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #9c6b3f, #6b4a28 70%);
    box-shadow: inset 0 -10px 30px rgba(0,0,0,0.5), inset 0 8px 20px rgba(255,220,160,0.25);
  }
  #board::after {
    content:""; position:absolute; inset:8px; border-radius:50%;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 26px, rgba(120,80,40,0.6) 26px 27px);
  }

  #pizza { position: absolute; width: 260px; height: 260px; border-radius: 50%; }
  #crust {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 40% 32%, #e8a04c, #c97a24 60%, #a55e15);
    box-shadow: inset 0 -6px 14px rgba(90,45,10,0.8), inset 0 6px 12px rgba(255,220,150,0.5);
  }
  #crust::after {
    content:""; position:absolute; inset:4%; border-radius:50%;
    background: repeating-conic-gradient(rgba(120,60,10,0.35) 0 6deg, transparent 6deg 12deg);
    mix-blend-mode: multiply;
  }
  #cheese {
    position: absolute; inset: 20px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,235,150,0.95), rgba(255,215,90,0.85) 45%, rgba(240,170,50,0.95) 100%);
    box-shadow: 0 0 10px rgba(180,90,20,0.5);
  }
  #cheese::before {
    content:""; position:absolute; inset:-14px; border-radius:50%;
    background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(200,60,15,0.55) 62%, rgba(200,60,15,0.35) 74%, transparent 78%);
    filter: blur(1px);
  }
  #cheese::after {
    content:""; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 70% 75%, rgba(190,110,30,0.5) 0 6%, transparent 9%),
      radial-gradient(circle at 25% 80%, rgba(190,110,30,0.45) 0 7%, transparent 10%),
      radial-gradient(circle at 80% 25%, rgba(200,120,35,0.4) 0 5%, transparent 9%),
      radial-gradient(circle at 50% 45%, rgba(200,130,40,0.35) 0 6%, transparent 9%);
  }
  #slices {
    position:absolute; inset:-8px; border-radius:50%; opacity:0.35; pointer-events:none;
    background: repeating-conic-gradient(from 0deg, rgba(120,60,15,0.8) 0 1.5deg, transparent 1.5deg 45deg);
    mix-blend-mode: multiply;
  }
  #toppings { position: absolute; inset: 0; }
  #toppings .top {
    position: absolute; transform: translate(-50%,-50%); line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
    animation: topBob 3.5s ease-in-out infinite;
  }
  .steamRow { position: absolute; inset: 0; pointer-events: none; }
  .steam {
    position: absolute; width: 18px; height: 34px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.4), transparent 70%);
    animation: steam 2.4s ease-out infinite; pointer-events: none;
  }
  #chefWheel { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .chef { position: absolute; font-size: 36px; animation: chefBob 2.2s ease-in-out infinite; }

  .float-text {
    position: absolute; font-weight: 700; font-size: 22px; color: #ffd34d;
    text-shadow: 0 2px 6px rgba(0,0,0,0.65); pointer-events: none; z-index: 20;
    animation: floatUp 0.9s ease-out forwards;
  }
  .particle {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 19;
    animation: pop 0.6s ease-out forwards;
  }
  .combo-text {
    position: absolute; top: 7%; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 700; color: #ff9de2; text-shadow: 0 0 16px #ff2ec4;
    letter-spacing: 3px; z-index: 21; pointer-events: none;
  }

  #goldenPizza {
    position: absolute; width: 64px; height: 64px; border-radius: 50%; z-index: 22; cursor: pointer;
    background: radial-gradient(circle at 40% 35%, #fff3a0, #ffcf33 55%, #d99a00);
    box-shadow: 0 0 26px rgba(255,210,60,0.9), inset 0 -8px 16px rgba(150,100,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; animation: goldFloat 5s ease-in-out infinite;
    pointer-events: auto;
  }
  #goldenPizza::before {
    content:""; position:absolute; inset:18%;
    border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #ffe27a, #ffc21a 70%);
  }
  #goldenPizza .dot {
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:#c97a10; z-index:2;
  }
  @keyframes goldFloat {
    0%   { transform: translate(0,0) rotate(0) scale(1); }
    25%  { transform: translate(60px,-40px) rotate(40deg) scale(1.15); }
    50%  { transform: translate(-50px,-90px) rotate(-30deg) scale(0.9); }
    75%  { transform: translate(-70px,-20px) rotate(20deg) scale(1.1); }
    100% { transform: translate(0,0) rotate(0) scale(1); }
  }

  #shop {
    width: 360px; background: rgba(22,13,6,0.92);
    border-left: 2px solid rgba(255,211,77,0.25);
    display: flex; flex-direction: column;
  }
  .tabs { display: flex; border-bottom: 1px solid rgba(255,211,77,0.2); }
  .tab {
    flex: 1; padding: 12px 4px; text-align: center; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: #caa25a;
    background: none; border: none; border-bottom: 3px solid transparent; transition: 0.15s;
  }
  .tab.on { color: #ffd34d; border-bottom-color: #ffd34d; }
  .panel { flex: 1; overflow-y: auto; padding: 14px 12px; display: none; }
  .panel.on { display: block; }
  .panel h3 { font-size: 14px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 10px; }

  .card {
    background: linear-gradient(180deg, #3a2415, #241408);
    border: 1px solid rgba(255,211,77,0.2); border-radius: 12px;
    padding: 11px; margin-bottom: 10px; display: flex; align-items: center; gap: 11px;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
  .card.locked { opacity: 0.45; cursor: not-allowed; }
  .card.buyable { border-color: #ffd34d; box-shadow: 0 0 14px rgba(255,211,77,0.35); animation: pulse 1.4s infinite; }
  .card .ic { font-size: 28px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.07); border-radius: 10px; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-weight: 700; font-size: 15px; }
  .card .name small { opacity: 0.6; font-size: 11px; font-weight: 400; margin-left: 5px; }
  .card .desc { font-size: 12px; opacity: 0.7; margin: 2px 0; }
  .card .price { font-size: 13px; color: #ffd34d; font-weight: 600; }

  .rebirthBox {
    background: linear-gradient(135deg, #3d2a66, #241443);
    border: 1px solid #a06bff; border-radius: 14px; padding: 16px; text-align: center;
    margin-bottom: 14px;
  }
  .rebirthBox h3 { color: #d4b3ff; font-size: 17px; }
  .rebirthBox p { font-size: 12px; opacity: 0.8; margin: 6px 0 12px; }
  .btn {
    font-family: inherit; font-weight: 700; font-size: 15px; color: #2a1506;
    background: linear-gradient(180deg, #ffdf78, #ffb43a); border: none;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 0 #a56400; transition: 0.1s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a56400; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost { background: linear-gradient(180deg,#9d7bff,#7a43e6); color: #fff; box-shadow: 0 4px 0 #4a24a0; }
  .btn.ghost:active { box-shadow: 0 1px 0 #4a24a0; }
  #ppBadge { display: inline-block; background: #ffd34d; color: #3a2415; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; font-size: 13px; }

  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
    align-items: center; justify-content: center; z-index: 200;
  }
  #modal.on { display: flex; }
  #modal .box {
    background: linear-gradient(180deg, #3d2a15, #241408);
    border: 2px solid #ffd34d; border-radius: 18px; padding: 26px 30px; text-align: center; max-width: 360px;
  }
  #modal .box h2 { font-size: 22px; color: #ffd34d; margin: 8px 0; }
  #modal .box .pp { font-size: 42px; }
  #modal .box p { font-size: 13px; opacity: 0.8; margin: 6px 0 16px; }

  .toast {
    position: fixed; top: 16px; right: 16px; z-index: 300;
    background: rgba(22,13,6,0.95); border: 1px solid #ffd34d; border-radius: 10px;
    padding: 12px 18px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    animation: slideIn 0.3s ease-out; max-width: 300px;
  }
  .toast b { color: #ffd34d; }
  #resetBtn {
    position: fixed; bottom: 12px; right: 12px; z-index: 50;
    background: rgba(255,60,60,0.14); color: #ff8585; border: 1px solid rgba(255,60,60,0.4);
    padding: 5px 12px; border-radius: 8px; font-family: inherit; font-size: 11px; cursor: pointer;
  }

  @keyframes floatUp { 0% { opacity:1; transform: translateY(0) scale(1);} 100% {opacity:0; transform: translateY(-90px) scale(1.4);} }
  @keyframes pop { 0% { transform: translate(0,0) scale(1); opacity:1;} 100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity:0;} }
  @keyframes pulse { 50% { box-shadow: 0 0 24px rgba(255,211,77,0.7);} }
  @keyframes slideIn { from { transform: translateX(120%); opacity:0;} to { transform:none; opacity:1;} }
  @keyframes chefBob { 0%,100% { transform: translateY(0) rotate(-6deg);} 50% { transform: translateY(-12px) rotate(6deg);} }
  @keyframes topBob { 0%,100% { transform: translate(-50%,-50%) rotate(0);} 50% { transform: translate(-50%,-52%) rotate(3deg);} }
  @keyframes steam { 0% { transform: translateY(4px) scale(0.6); opacity:0;} 30% {opacity:0.6;} 100% { transform: translateY(-48px) scale(1.4); opacity:0;} }

  #pizzaWrap { position: absolute; inset: 0; }
  #bobGroup {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    animation: pizzaBob 6s ease-in-out infinite;
  }
  @keyframes pizzaBob {
    0%, 100% { transform: rotate(-1.6deg) translateY(0); }
    50%      { transform: rotate(1.6deg) translateY(-7px); }
  }
  #stageGlow {
    position: absolute; width: 430px; height: 430px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,190,80,0.16), transparent 62%);
    animation: glowPulse 4s ease-in-out infinite; pointer-events: none; z-index: 0;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.07); }
  }
  #comboRing {
    position: absolute; inset: 0; z-index: 40; pointer-events: none;
    display: flex; align-items: center; justify-content: center; opacity: 0;
    transition: opacity 0.2s;
  }
  #comboRing.anim svg { animation: ringSpin 3.5s linear infinite; }
  #comboRing svg { width: 300px; height: 300px; filter: drop-shadow(0 0 8px rgba(255,157,226,0.6)); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 3; }
  .ring-fg { fill: none; stroke: #ffd34d; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 301.6; stroke-dashoffset: 301.6; }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  #comboMsg.pop { animation: comboPop 0.3s ease; }
  @keyframes comboPop {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.2) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .float-text.gold { color: #ffd34d; font-size: 30px; }

  #money.pop, #perClick.pop, #perSec.pop { animation: numPop 0.18s ease; }
  @keyframes numPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); color: #fff; }
    100% { transform: scale(1); }
  }

  .dropTop {
    position: absolute; font-size: 62px; z-index: 25; pointer-events: none;
    left: 50%; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    animation: dropTop 0.9s cubic-bezier(0.55, 0, 0.55, 0.9) forwards;
  }
  @keyframes dropTop {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    70%  { transform: translateY(62vh) rotate(260deg) scale(0.92); opacity: 1; }
    100% { transform: translateY(64vh) rotate(340deg) scale(0.15); opacity: 0; }
  }

  .flyBit {
    position: absolute; font-size: 22px; pointer-events: none; z-index: 19;
    animation: flyBit 0.9s cubic-bezier(0.3, -0.4, 0.6, 1) forwards;
  }
  @keyframes flyBit {
    0%   { transform: translate(0,0) rotate(0) scale(1); opacity: 1; }
    55%  { transform: translate(var(--dx), -70px) rotate(var(--drot)) scale(1.15); opacity: 1; }
    100% { transform: translate(calc(var(--dx) * 0.6), 46px) rotate(calc(var(--drot) * 1.8)) scale(0.55); opacity: 0; }
  }

  .glint {
    position: absolute; width: 6px; height: 6px; z-index: 23; pointer-events: none;
    background: #fff; border-radius: 2px; transform: rotate(45deg);
    box-shadow: 0 0 8px 2px rgba(255,220,120,0.8);
    animation: glint 0.75s ease-out forwards;
  }
  @keyframes glint {
    0% { opacity: 0; transform: rotate(45deg) scale(0.4); }
    40% { opacity: 1; transform: rotate(45deg) scale(1); }
    100% { opacity: 0; transform: rotate(45deg) scale(1.4); }
  }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 170; overflow: hidden; }
  .conf {
    position: absolute; width: 10px; height: 16px; border-radius: 2px;
    animation: confFall 3s ease-in forwards;
  }
  @keyframes confFall {
    0%   { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--sway), var(--fall)) rotate(720deg); opacity: 0; }
  }

  .btn.ghost:not(:disabled) { animation: btnGlow 1.6s ease-in-out infinite; }
  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 4px 0 #4a24a0; }
    50% { box-shadow: 0 4px 0 #4a24a0, 0 0 22px rgba(157,123,255,0.9); }
  }
  .toast.ach {
    border-color: #a06bff; font-size: 15px;
    background: linear-gradient(135deg, rgba(61,42,102,0.97), rgba(36,20,68,0.97));
    background-size: 200%;
    animation: slideIn 0.3s ease-out, shimmer 2.5s linear infinite;
  }
  .toast.ach b { color: #d4b3ff; }
  @keyframes shimmer { 0% { background-position: 0 0; } 100% { background-position: 200% 0; } }

  @media (max-width: 760px) {
    .main { flex-direction: column; }
    #shop { width: 100%; height: 42%; border-left: none; border-top: 2px solid rgba(255,211,77,0.25); }
    #clickArea { height: 58%; }
    #pizzaWrap { transform: scale(0.72); transform-origin: center; }
    .stats { gap: 10px; font-size: 12px; }
    .stat b { font-size: 16px; }
    .logo { font-size: 18px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">🍕 Pizza <span>Clicker</span> 2</div>
      <div class="rank" id="rankTxt">🍳 Apprentice Chef</div>
    </div>
    <div class="stats">
      <div class="stat"><span>Pizza Gold</span><b id="money">0</b></div>
      <div class="stat"><span>Per Click</span><b id="perClick">1<em id="clickMult"></em></b></div>
      <div class="stat"><span>Per Second</span><b id="perSec">0<em id="secMult"></em></b></div>
    </div>
    <button class="mute" id="muteBtn" title="Sound on/off">🔊</button>
  </header>

  <div class="main">
    <div id="clickArea">
      <div id="comboMsg" class="combo-text" style="display:none"></div>
      <div id="stage">
        <div id="stageGlow"></div>
        <div id="pizzaWrap">
          <div id="bobGroup">
            <div class="steamRow"></div>
            <div id="board"></div>
            <div id="pizza">
              <div id="crust"></div>
              <div id="cheese"></div>
              <div id="slices"></div>
              <div id="toppings"></div>
            </div>
            <div id="chefWheel"></div>
            <div id="comboRing">
              <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" class="ring-bg"/>
                <circle cx="50" cy="50" r="48" class="ring-fg" id="ringFg"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="shop">
      <div class="tabs">
        <button class="tab on" data-tab="upg">⚙️ Upgrades</button>
        <button class="tab" data-tab="top">🍕 Toppings</button>
        <button class="tab" data-tab="leg">🌟 Legend</button>
      </div>
      <div id="panel-upg" class="panel on"><h3>Build your kitchen</h3><div class="list"></div></div>
      <div id="panel-top" class="panel"><h3>Decorate your pizza</h3><div class="list"></div></div>
      <div id="panel-leg" class="panel"><div class="list"></div></div>
    </div>
  </div>
</div>
<button id="resetBtn">↺ Reset</button>

<div id="modal">
  <div class="box">
    <div class="pp">🌟</div>
    <h2 id="mTitle">REBIRTH!</h2>
    <p id="mText">Gain Pizza Legend Points and start fresh with a permanent boost.</p>
    <button class="btn ghost" id="mBtn">Rebirth</button>
  </div>
</div>
<div id="fx"></div>

<script>
// ================= DATA =================
const UPGRADES = [
  { id:'oven',  icon:'🔥', name:'Gas Oven',         desc:'+1 per tap',      base: 15,      type:'click', gain: 1,   costMult: 1.15 },
  { id:'chef',  icon:'👨‍🍳', name:'Master Chef',      desc:'+1 / second',    base: 50,      type:'prod',  gain: 1,   costMult: 1.15 },
  { id:'mixer', icon:'🥣', name:'Dough Mixer',      desc:'+1 per tap',      base: 100,     type:'click', gain: 1,   costMult: 1.18 },
  { id:'robot', icon:'🤖', name:'Robo Baker',       desc:'+5 / second',     base: 400,     type:'prod',  gain: 5,   costMult: 1.15 },
  { id:'sauce', icon:'🍅', name:'Tomato Fountain',  desc:'+3 per tap',      base: 1200,    type:'click', gain: 3,   costMult: 1.20 },
  { id:'kin',   icon:'👵', name:'Grandma Rollouts', desc:'+10 / second',    base: 3000,    type:'prod',  gain: 10,  costMult: 1.15 },
  { id:'cone',  icon:'🔥', name:'Turbo Tile Oven',  desc:'+10 per tap',     base: 10000,   type:'click', gain: 10,  costMult: 1.20 },
  { id:'drone', icon:'🛸', name:'Delivery Drone',   desc:'+25 / second',    base: 25000,   type:'prod',  gain: 25,  costMult: 1.15 },
  { id:'portal',icon:'🌀', name:'Pizza Portal',     desc:'+100 / second',   base: 120000,  type:'prod',  gain: 100, costMult: 1.16 },
  { id:'mine',  icon:'⛏️', name:'Pepperoni Mine',   desc:'+250 / second',   base: 600000,  type:'prod',  gain: 250, costMult: 1.16 },
  { id:'sun',   icon:'☀️', name:'Dough Star Reactor',desc:'+1000 / second', base: 3000000, type:'prod',  gain: 1000, costMult: 1.16 },
];

const TOPPINGS = [
  { id:'mushroom',  emoji:'🍄', name:'Mushrooms',         type:'prod', gain: 1,   base: 500,      copy:'Crunchy umami!' },
  { id:'olive',     emoji:'🫒', name:'Kalamata Olives',   type:'prod', gain: 3,   base: 2000,     copy:'Salty circles of joy.' },
  { id:'chili',     emoji:'🌶️', name:'Chili Peppers',     type:'prod', gain: 8,   base: 8000,     copy:'Spice it up!' },
  { id:'honey',     emoji:'🍯', name:'Hot Honey',         type:'tap',  gain: 6,   base: 22000,    copy:'Drizzle of +6 per tap.' },
  { id:'pep',       emoji:'🥓', name:'Pepperoni',         type:'prod', gain: 20,  base: 70000,    copy:'The classic.' },

let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f, dur, type='sine', vol=0.12, delay=0){
  if(muted) return;
  const c = ac(), t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
}
const sClick = () => tone(480 + Math.random()*240, 0.09, 'triangle', 0.08);
const sBuy   = () => { tone(620, .1, 'square',.06); tone(930, .14, 'square',.06, .05); };

const sAch   = () => { [523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',.09,i*.08)); };
const sReb   = () => { [392,494,587,784,988].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.09)); };

// ================= HELPERS =================
function fmt(n){
  if(!isFinite(n)) n = 0;
  if(n < 1000) return Math.floor(n).toLocaleString();
  const units = ['k','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
  let i = -1; do { n /= 1000; i++; } while (n >= 1000 && i < units.length-1);
  return n.toFixed(2) + units[i];
}

function getClickMult(){ return 1 + state.points*0.05 + (state.perks.slice||0)*0.10; }
function getProdMult(){  return 1 + state.points*0.05 + (state.perks.time||0)*0.10; }
function getLuckMult(){  return 1 + (state.perks.luck||0)*0.25; }

function clickPower(){
  let p = 1;
  for(const u of upgrades) if(u.type==='click') p += u.gain * u.count;
  for(const u of toppings)  if(u.type==='tap')   p += u.gain * u.count;
  return p * getClickMult();
}
function prodPower(){
  let p = 0;
  for(const u of upgrades) if(u.type==='prod') p += u.gain * u.count;
  for(const u of toppings)  if(u.type==='prod') p += u.gain * u.count;
  return p * getProdMult();
}
function totalToppings(){ return Object.values(state.toppings).reduce((a,b)=>a+b,0); }
function allToppingsBought(){ return Object.values(state.toppings).length >= TOPPINGS.length && Object.values(state.toppings).every(c => c > 0); }

function costOf(u){ return Math.floor(u.base * Math.pow(u.costMult, u.count)); }
function perkCost(p){ return p.level + 1; }
function rebirthQty(){ return Math.floor(Math.pow(state.totalEarned / 1e6, 0.5)); }

function unlockCheck(u){
  const t = state.totalEarned;
  const map = { chef:100, mixer:500, robot:2000, sauce:5000, kin:15000, cone:50000, drone:150000, portal:800000, mine:4000000, sun:20000000 };
  return t >= (map[u.id] ?? 0);
}
function topUnlock(u){
  const t = state.totalEarned;
  const map = { olive:1000, chili:4000, honey:10000, pep:35000, pine:120000, basil:400000, sausage:1500000, truffle:5000000 };
  return t >= (map[u.id] ?? 0);
}
function rankFor(p){
  let r = RANKS[0].r;

}

function topPositions(typeIdx, count){
  const arr = [], center = 130;
  for(let k=0;k<count;k++){
    const angle = k*2.399963 + typeIdx*1.7;
    const band  = k % 10;
    const r = 26 + band*9 + ((k*7) % 5);
    arr.push({
      x: center + Math.cos(angle)*r,
      y: center + Math.sin(angle)*r,
      rot: (k*57 + typeIdx*33) % 360,
      z: Math.round(center + Math.sin(angle)*r)
    });
  }
  return arr;
}

function buildAll(){
  upgrades = UPGRADES.map(u=>({...u, count: state.upgrades[u.id]||0}));
  toppings = TOPPINGS.map(t=>({...t, count: state.toppings[t.id]||0, costMult: 1.16}));
  buildUps();
  buildTops();
  buildPerks();
  renderToppings(); renderSteam(); renderChefs();
}

function cardFor(u, onBuy){
  const d = document.createElement('div');
  d.className = 'card' + (u.locked?' locked':'');
  d.innerHTML = `
    <div class="ic">${u.icon || u.emoji || '🍕'}</div>
    <div class="info">
      <div class="name">${u.name}<small>×${u.count||0}</small></div>
      <div class="desc">${u.desc || u.copy}</div>
      <div class="price">🍕 ${fmt(u.cost)}</div>
    </div>`;
  d.addEventListener('click', ()=>{
    if(u.locked){ sNo(); toast('🔒 ' + u.name + ' unlocks as you earn more pizza!'); return; }
    onBuy(u, d);
  });
  return d;
}

function buyUpg(u){
  const def = upgrades.find(x=>x.id===u.id);
  const cost = costOf(def);
  if(state.gold < cost){ sNo(); toast('Not enough pizza gold! 🍕'); return; }
  state.gold -= cost; def.count++; state.upgrades[u.id] = def.count;
  sBuy();
  toast(`${u.icon} Bought ${u.name}! (${u.gain} ${u.type==='click'?'/tap':'/sec'})`);
  renderSteam(); renderChefs();
  buildUps();
  updateAll();
}
function buyTop(u){
  const def = toppings.find(x=>x.id===u.id);
  const cost = costOf(def);
  if(state.gold < cost){ sNo(); toast('Not enough pizza gold! 🍕'); return; }
  state.gold -= cost; def.count++; state.toppings[u.id] = def.count;
  sBuy();
  toast(u.id==='pine' ? '🍍 PINEAPPLE?! Brave choice. (+'+u.gain+'/sec)' : `${u.emoji} Added ${u.name} to your pizza!`);
  dropTopping(u.emoji);
  renderToppings();
  buildTops();
  updateAll();
}

function buildUps(){
  const list = $('panel-upg').querySelector('.list');
  list.innerHTML = '';
  const sorted = [...upgrades].sort((a,b)=>costOf(a)-costOf(b));
  for(const u of sorted){
    list.appendChild(cardFor({...u, cost: costOf(u), locked: !unlockCheck(u)}, buyUpg));
  }
  staggerIn(list);
  refreshAvailability($('panel-upg'));
}
function buildTops(){
  const list = $('panel-top').querySelector('.list');
  list.innerHTML = '';
  const sorted = [...toppings].sort((a,b)=>costOf(a)-costOf(b));
  for(const u of sorted){
    list.appendChild(cardFor({...u, cost: costOf(u), locked: !topUnlock(u)}, buyTop));
  }
  staggerIn(list);
  refreshAvailability($('panel-top'));
}
function staggerIn(list){
  const cards = [...list.children];
  cards.forEach((c,i)=>{
    c.style.opacity = '0';
    c.style.transition = 'opacity 0.28s ease ' + (i*0.035) + 's, transform 0.1s ease, box-shadow 0.15s ease';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.opacity = '1';
    }));
  });
  setTimeout(()=>{
    cards.forEach(c=>{
      c.style.opacity = '';
      c.style.transition = '';
    });
  }, cards.length*35 + 320);
}

function refreshAvailability(panel){
  const cards = panel.querySelectorAll('.card');
  const arr = panel.id==='panel-top'
    ? [...toppings].sort((a,b)=>costOf(a)-costOf(b))
    : [...upgrades].sort((a,b)=>costOf(a)-costOf(b));
  for(let i=0;i<cards.length;i++){
    const u = arr[i];
    if(!u) continue;
    const locked = panel.id==='panel-top' ? !topUnlock(u) : !unlockCheck(u);
    cards[i].classList.toggle('buyable', !locked && state.gold >= costOf(u));
  }
}

  $('mTitle').textContent = 'REBIRTH x' + pp + '!';
  $('mText').innerHTML = `
    Gain <b style="color:#ffd34d">${pp}</b> Legend Point${pp>1?'s':''} → +<b style="color:#ffd34d">${pp*5}%</b> to everything, forever.<br>
    New rank: <b>${rankFor(state.points + pp)}</b><br><br>
    <span style="opacity:0.7">Pizza gold, kitchen and toppings reset. Achievements & Legend perks are kept.</span>`;
  $('mBtn').onclick = ()=>doRebirth(pp);
}
function doRebirth(pp){
  $('modal').classList.remove('on');
  state.points += pp;
  state.rebirths++;
  state.gold = 0; state.totalEarned = 0; state.totalTaps = 0;
  state.upgrades = {}; state.toppings = {};
  if(goldenEl){ goldenEl.remove(); goldenEl = null; }
  sReb();
  confetti();
  toast('🌟 REBIRTH! New rank: ' + rankFor(state.points) + ' (+' + (pp*5) + '% forever)');
  buildAll();
  updateAll();
}

// ================= TABS =================
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    $('panel-'+t.dataset.tab).classList.add('on');
  });
});

// ================= ACHIEVEMENTS =================
let shownSet = new Set();
function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(!shownSet.has(a.id) && a.need(state)){
      shownSet.add(a.id);
      sAch();
      const t = document.createElement('div');
      t.className = 'toast ach';
      t.innerHTML = `${a.icon} Achievement unlocked! <b>${a.name}</b>`;
      confetti();
      document.body.appendChild(t);
      setTimeout(()=>t.remove(), 3600);
    }
  }
}

// ================= UI =================
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
let lastShownMoney='', lastShownClick='', lastShownSec='';
function updateAll(){
  const m = fmt(state.gold);
  if(m !== lastShownMoney){
    lastShownMoney = m;
    moneyEl.textContent = m;
    moneyEl.classList.remove('pop'); void moneyEl.offsetWidth; moneyEl.classList.add('pop');
  }
  const pc = fmt(clickPower());
  if(pc !== lastShownClick){
    lastShownClick = pc;
    clickEl.firstChild.textContent = pc;
  }
  const ps = fmt(prodPower());
  if(ps !== lastShownSec){
    lastShownSec = ps;
    secEl.firstChild.textContent = ps;
    secEl.classList.remove('pop'); void secEl.offsetWidth; secEl.classList.add('pop');
  }
  const cm = getClickMult(), sm = getProdMult();
  clickMultEl.textContent = cm > 1.0001 ? ' ×'+cm.toFixed(2) : '';
  secMultEl.textContent = sm > 1.0001 ? ' ×'+sm.toFixed(2) : '';
  rankTxt.textContent = rankFor(state.points);
  refreshAvailability($('panel-upg'));
  refreshAvailability($('panel-top'));
  checkAchievements();
}

// ================= GAME LOOP =================
let last = Date.now(), lastPerk = 0, lastGlintAt = 0;
const RING_C = 2 * Math.PI * 48;
function updateRing(now){
  if(comboCount >= 2 && now < comboUntil){
    comboRing.style.opacity = 1;
    comboRing.classList.add('anim');
    const frac = Math.max(0, (comboUntil - now)/1000);
    ringFg.style.strokeDashoffset = RING_C * (1 - frac);
    ringFg.style.stroke = comboCount >= 30 ? '#ff3dc4' : comboCount >= 20 ? '#ff7ad9' : comboCount >= 10 ? '#ff9de2' : '#ffd34d';
  } else {
    comboRing.style.opacity = 0;
    comboRing.classList.remove('anim');
  }
}
function loop(){
  const now = Date.now();
  const rate = prodPower();
  if(rate > 0){
    const dt = (now - last)/1000;
    state.gold += rate * dt; state.totalEarned += rate * dt;
  }
  last = now;
  if(now - lastPerk > 1500){
    lastPerk = now;
    buildPerks();
  }
  if(now >= nextGoldenAt && !goldenEl){ spawnGolden(); }
  if(rate >= 50 && now - lastGlintAt > 500){
    lastGlintAt = now;
    spawnGlint();
  }
  updateRing(now);
  updateAll();
  requestAnimationFrame(loop);
}

// ================= SAVE / LOAD =================
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ state = Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}
setInterval(save, 3000);
window.addEventListener('beforeunload', save);
$('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset ALL pizza progress? 🍕')){
    localStorage.removeItem(SAVE_KEY); location.reload();
  }
});
$('muteBtn').textContent = muted ? '🔇' : '🔊';
$('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  localStorage.setItem('pizzaMuted', muted?'1':'0');
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(!muted) sBuy();
});

// ================= INIT =================
load();
buildAll();
updateAll();
requestAnimationFrame(loop);
</script>
</body>
</html>
